<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Տուփ բացելու խաղ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Արագ CSS, որ տեսնես արդյունքը */
    .grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 15px; justify-content: center; margin-top: 50px; }
    .box { width: 80px; height: 80px; background-color: #ddd; cursor: pointer; border-radius: 12px; 
           display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
           background-image: url('img/cammon.jpg'); background-size: cover; }
    #message { font-size: 20px; font-weight: bold; margin: 20px; min-height: 30px; }
    .win { color: green; }
    .lose { color: red; }
  </style>
</head>
<body>

  <div class="h1">
    <h1>🎁 Ընտրիր մեկ տուփ</h1>
    <p id="message"></p>
  </div>

  <div class="grid" id="boxGrid">
    <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
  </div>

  <br>
  <button id="refreshBtn">Խաղալ նորից 🔄</button>

  <script>
    const boxes = document.querySelectorAll(".box");
    const message = document.getElementById("message");
    const refreshBtn = document.getElementById("refreshBtn");

    let gameOver = false;
    let winAmount = "1000 դրամ"; // Սկզբնական արժեք, եթե սերվերը չաշխատի
    let winIndex = Math.floor(Math.random() * boxes.length);

    // 1. Սերվերից վերցնում ենք գումարը
    fetch("http://localhost:3001/game/reward")
      .then(res => res.json())
      .then(data => {
        if(data.reward) winAmount = data.reward;
      })
      .catch(err => console.log("Server-ը միացրած չէ, օգտագործվում է default reward:"));

    // 2. Կլիկի ֆունկցիան
    boxes.forEach((box, index) => {
      box.addEventListener("click", () => {
        if (gameOver) return;
        
        gameOver = true;
        box.style.backgroundImage = "none";
        box.style.backgroundColor = "#fff";

        if (index === winIndex) {
          box.textContent = winAmount;
          box.style.color = "green";
          message.innerHTML = `<span class="win">🎉 Շնորհավոր! Դու հաղթեցիր ${winAmount}</span>`;
        } else {
          box.textContent = "X";
          box.style.color = "red";
          message.innerHTML = `<span class="lose">❌ Ցավոք, դատարկ էր</span>`;
        }
      });
    });

    refreshBtn.onclick = () => location.reload();
  </script>
</body>
</html>
